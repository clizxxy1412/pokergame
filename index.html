<!doctype html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <title>Balatro</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Balatro">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000;
      position: fixed; inset: 0;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage { position: fixed; inset: 0; background: #000; }
    #loadingCanvas, #canvas {
      display: block; position: absolute; inset: 0;
      width: 100%; height: 100%;
      outline: none;
    }
    #canvas { visibility: hidden; }

    /* Portrait hint: the game is designed for landscape */
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 10;
      background: #0b1f2a; color: #e8f4fb;
      font: 600 18px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      align-items: center; justify-content: center; flex-direction: column; gap: 18px;
      text-align: center; padding: 24px;
    }
    #rotate svg { width: 72px; height: 72px; animation: tilt 2.2s ease-in-out infinite; }
    @keyframes tilt { 0%, 15% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    @media (prefers-reduced-motion: reduce) { #rotate svg { animation: none; } }

    #fatal {
      position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .88); color: #fff;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
      font: 16px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 24px;
    }
    #fatal[hidden] { display: none; }
    #fatal button {
      font: inherit; font-weight: 700; padding: 12px 28px; border: 0; border-radius: 10px;
      background: #e9499a; color: #fff;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()"></canvas>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <div id="rotate" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/>
    </svg>
    <div>Rotate your device to landscape</div>
  </div>

  <div id="fatal" hidden>
    <p></p>
    <button type="button" onclick="location.reload()">Reload</button>
  </div>

  <script src="js/boot.js"></script>
  <script src="js/loader.js"></script>
  <script src="app/love.js"></script>
</body>
</html>
